<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkbox Style Changer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <p id="title">Hello World!</p>

  <label><input type="checkbox" id="bold"> Bold</label><br>
  <label><input type="checkbox" id="italic"> Italic</label><br>
  <label><input type="checkbox" id="red"> Red Text</label><br>
  <label><input type="checkbox" id="big"> Bigger Text</label>

  <script src="script.js">
</body>
</html>
