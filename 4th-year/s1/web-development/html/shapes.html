<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Shapes Exercise</title>
</head>
<body>
    <svg width="400" height="300">
        <rect x="0" y="0" width="400" height="300" fill="#ddd" stroke="blue" stroke-width="4" />
        <circle cx="200" cy="150" r="60" fill="red" />
        <line x1="0" y1="0" x2="400" y2="300" stroke="black" stroke-width="2" />
        <text x="145" y="160" font-size="24" fill="black" >Hello SVG</text>
    </svg>
</body>
</html>
