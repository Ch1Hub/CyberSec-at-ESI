<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Révision Sécurité des Systèmes d'Exploitation</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a30;
      --panel-2: #1a2442;
      --text: #ecf0ff;
      --muted: #a6b2d9;
      --accent: #7aa2ff;
      --ok: #3ccf91;
      --bad: #ff6b6b;
      --warn: #ffd166;
      --border: #2a3762;
      --code: #0f1630;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #12214d 0, var(--bg) 45%);
    }

    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 26, 48, 0.95), rgba(12, 18, 35, 0.95));
      padding: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.12rem;
      line-height: 1.35;
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 14px;
    }

    .meta {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .chapter-list {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .chapter-btn {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      background: rgba(20, 31, 58, 0.85);
      cursor: pointer;
    }

    .chapter-btn:hover { border-color: var(--accent); }
    .chapter-btn.active {
      border-color: var(--accent);
      background: rgba(40, 61, 118, 0.35);
    }

    .chapter-title {
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .chapter-meta {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .score-pill {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      font-weight: 600;
    }

    .score-ok {
      border-color: rgba(60, 207, 145, 0.6);
      color: #b8ffe1;
    }

    .tools {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      display: grid;
      gap: 10px;
    }

    .input, .select, .toggle {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.9rem;
    }

    .toggle { display: flex; gap: 8px; align-items: center; }
    .toggle input { transform: translateY(1px); }

    main {
      padding: 20px;
      overflow: auto;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(20, 30, 56, 0.9);
      padding: 16px;
      margin-bottom: 14px;
    }

    .header-row {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .header-row h2 {
      margin: 0;
      font-size: 1.24rem;
      line-height: 1.35;
    }

    .tiny {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 6px;
      line-height: 1.35;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .tab {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .tab.active {
      background: rgba(122, 162, 255, 0.2);
      border-color: rgba(122, 162, 255, 0.6);
    }

    .panel.hidden { display: none; }

    .md h1, .md h2, .md h3, .md h4 {
      margin-top: 18px;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .md p {
      margin: 6px 0;
      color: #f2f6ff;
      line-height: 1.5;
    }

    .md ul {
      margin: 8px 0 8px 18px;
      padding: 0;
    }

    .md li {
      margin: 4px 0;
      line-height: 1.5;
    }

    .raw-lines {
      margin: 0;
      padding-left: 54px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.45;
    }

    .raw-lines li {
      padding: 0 10px 0 8px;
      white-space: pre-wrap;
      border-left: 1px dashed rgba(122, 162, 255, 0.15);
      color: #d7e2ff;
    }

    .raw-lines li::marker { color: #86a9ff; }
    mark {
      background: rgba(255, 209, 102, 0.35);
      color: #fff5d0;
      padding: 0 2px;
      border-radius: 4px;
    }

    .search-results {
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(13, 19, 38, 0.9);
      padding: 8px;
    }

    .search-hit {
      border-bottom: 1px dashed rgba(122, 162, 255, 0.2);
      padding: 6px 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.83rem;
      line-height: 1.4;
      color: #dbe6ff;
    }

    .search-hit:last-child { border-bottom: 0; }

    .details-list {
      margin: 0;
      padding-left: 20px;
    }

    .details-list li {
      margin: 8px 0;
      line-height: 1.5;
    }

    .q-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(17, 25, 48, 0.95);
    }

    .q-title {
      font-weight: 600;
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .option {
      display: block;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 7px;
      cursor: pointer;
      line-height: 1.4;
    }

    .option:hover { border-color: rgba(122, 162, 255, 0.7); }
    .option input { margin-right: 8px; }
    .option.correct { border-color: rgba(60, 207, 145, 0.7); background: rgba(60, 207, 145, 0.1); }
    .option.wrong { border-color: rgba(255, 107, 107, 0.7); background: rgba(255, 107, 107, 0.1); }

    .exp {
      margin-top: 6px;
      font-size: 0.84rem;
      padding: 6px 8px;
      border-radius: 8px;
      line-height: 1.45;
      border: 1px solid transparent;
      color: #dbe6ff;
      display: none;
    }

    .exp.show { display: block; }
    .exp.ok { border-color: rgba(60, 207, 145, 0.6); background: rgba(60, 207, 145, 0.08); }
    .exp.bad { border-color: rgba(255, 107, 107, 0.6); background: rgba(255, 107, 107, 0.08); }
    .exp.warn { border-color: rgba(255, 209, 102, 0.6); background: rgba(255, 209, 102, 0.08); }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn.primary {
      border-color: rgba(122, 162, 255, 0.7);
      background: rgba(122, 162, 255, 0.2);
    }

    .quiz-result {
      margin-top: 10px;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      background: rgba(14, 20, 40, 0.9);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .load-warning {
      border: 1px solid rgba(255, 209, 102, 0.6);
      background: rgba(255, 209, 102, 0.12);
      color: #fff3c4;
      border-radius: 10px;
      padding: 10px;
      line-height: 1.45;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    @media (max-width: 1020px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Révision interactive — OpSysSec</h1>
      <div class="sub">Cours + QCM détaillés par chapitre</div>
      <div id="globalMeta" class="meta"></div>
      <div id="chapterList" class="chapter-list"></div>

      <div class="tools">
        <input id="searchInput" class="input" type="text" placeholder="Recherche mot/terme précis..." />
        <label class="toggle">
          <input id="rawMode" type="checkbox" />
          <span>Mode brut avec numéros de ligne</span>
        </label>
      </div>
    </aside>

    <main>
      <section class="card">
        <div class="header-row">
          <div>
            <h2 id="chapterTitle">Chargement...</h2>
            <div id="chapterStats" class="tiny"></div>
          </div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="cours">Cours complet</button>
          <button class="tab" data-tab="details">Points détaillés</button>
          <button class="tab" data-tab="qcm">QCM chapitre</button>
        </div>
      </section>

      <section id="searchPanel" class="card panel hidden">
        <h3 style="margin-top:0">Résultats de recherche (chapitre courant)</h3>
        <div id="searchResults" class="search-results"></div>
      </section>

      <section id="coursPanel" class="card panel">
        <div id="loadWarning"></div>
        <div id="coursContent"></div>
      </section>

      <section id="detailsPanel" class="card panel hidden">
        <h3 style="margin-top:0">Check-list des détails à mémoriser</h3>
        <ul id="detailsList" class="details-list"></ul>
      </section>

      <section id="qcmPanel" class="card panel hidden">
        <h3 style="margin-top:0">QCM interactif du chapitre</h3>
        <div id="quizContainer"></div>
      </section>
    </main>
  </div>

  <script>

    const state = {
      activeId: chapterConfigs[0].id,
      tab: "cours",
      query: "",
      rawMode: false,
      chapters: {},
      scores: {}
    };

    const chapterListEl = document.getElementById("chapterList");
    const globalMetaEl = document.getElementById("globalMeta");
    const chapterTitleEl = document.getElementById("chapterTitle");
    const chapterStatsEl = document.getElementById("chapterStats");
    const loadWarningEl = document.getElementById("loadWarning");
    const coursContentEl = document.getElementById("coursContent");
    const detailsListEl = document.getElementById("detailsList");
    const quizContainerEl = document.getElementById("quizContainer");
    const searchInputEl = document.getElementById("searchInput");
    const rawModeEl = document.getElementById("rawMode");
    const searchPanelEl = document.getElementById("searchPanel");
    const searchResultsEl = document.getElementById("searchResults");

    const panels = {
      cours: document.getElementById("coursPanel"),
      details: document.getElementById("detailsPanel"),
      qcm: document.getElementById("qcmPanel")
    };

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function regexEscape(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(line, q) {
      const safe = escapeHtml(line);
      if (!q) return safe || " ";
      const re = new RegExp(regexEscape(q), "gi");
      return safe.replace(re, (m) => `<mark>${m}</mark>`) || " ";
    }

    function extractTitle(text, fallback) {
      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const i = lines.findIndex((l) => /chapitre\s+\d+/i.test(l));
      if (i === -1) return fallback;
      const next = lines[i + 1] && !/^#+/.test(lines[i + 1]) ? " " + lines[i + 1] : "";
      return (lines[i] + next).replace(/\s+/g, " ").trim();
    }

    function markdownToHtml(md) {
      const lines = md.split(/\r?\n/);
      const out = [];
      let inList = false;
      let listType = "ul";

      function closeList() {
        if (inList) {
          out.push(`</${listType}>`);
          inList = false;
        }
      }

      for (const line of lines) {
        const t = line.trim();
        if (!t) {
          closeList();
          continue;
        }

        const heading = t.match(/^(#{1,6})\s*(.*)$/);
        if (heading) {
          closeList();
          const lvl = heading[1].length;
          out.push(`<h${lvl}>${escapeHtml(heading[2] || "")}</h${lvl}>`);
          continue;
        }

        const bullet = t.match(/^([\-*•–])\s*(.*)$/);
        if (bullet) {
          if (!inList || listType !== "ul") {
            closeList();
            inList = true;
            listType = "ul";
            out.push("<ul>");
          }
          out.push(`<li>${escapeHtml(bullet[2] || "")}</li>`);
          continue;
        }

        const ordered = t.match(/^\d+[.)]\s+(.*)$/);
        if (ordered) {
          if (!inList || listType !== "ol") {
            closeList();
            inList = true;
            listType = "ol";
            out.push("<ol>");
          }
          out.push(`<li>${escapeHtml(ordered[1] || "")}</li>`);
          continue;
        }

        if (/^[-_=]{3,}$/.test(t)) {
          closeList();
          out.push("<hr />");
          continue;
        }

        closeList();
        out.push(`<p>${escapeHtml(t)}</p>`);
      }

      closeList();
      return out.join("\n");
    }

    function renderRaw(text, q) {
      const lines = text.split(/\r?\n/);
      return `<ol class="raw-lines">${lines.map((line) => `<li>${highlightText(line, q)}</li>`).join("")}</ol>`;
    }

    function getActiveChapter() {
      return state.chapters[state.activeId];
    }

    function updateGlobalMeta() {
      const loaded = Object.values(state.chapters).filter((c) => c.loaded).length;
      const totalLines = Object.values(state.chapters).reduce((a, c) => a + c.lineCount, 0);
      const quizDone = Object.keys(state.scores).length;
      globalMetaEl.innerHTML = `Fichiers chargés: <b>${loaded}/${chapterConfigs.length}</b><br>Lignes de cours: <b>${totalLines.toLocaleString("fr-FR")}</b><br>QCM validés: <b>${quizDone}/${chapterConfigs.length}</b>`;
    }

    function renderChapterList() {
      chapterListEl.innerHTML = chapterConfigs.map((cfg) => {
        const c = state.chapters[cfg.id];
        const score = state.scores[cfg.id];
        const scoreText = score ? `${score.score}/${score.total}` : "—";
        const scoreClass = score ? "score-pill score-ok" : "score-pill";
        return `
          <button class="chapter-btn ${state.activeId === cfg.id ? "active" : ""}" data-id="${cfg.id}">
            <div class="chapter-title">${escapeHtml(c.title)}</div>
            <div class="chapter-meta">
              <span>${c.lineCount} lignes</span>
              <span class="${scoreClass}">${scoreText}</span>
            </div>
          </button>
        `;
      }).join("");

      chapterListEl.querySelectorAll(".chapter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeId = btn.dataset.id;
          renderAll();
        });
      });
    }

    function renderSearchResults(chapter) {
      const q = state.query.trim();
      if (!q) {
        searchPanelEl.classList.add("hidden");
        searchResultsEl.innerHTML = "";
        return;
      }

      const re = new RegExp(regexEscape(q), "i");
      const hits = chapter.lines
        .map((line, i) => ({ line, no: i + 1 }))
        .filter((x) => re.test(x.line))
        .slice(0, 220);

      searchPanelEl.classList.remove("hidden");
      if (!hits.length) {
        searchResultsEl.innerHTML = `<div class="search-hit">Aucun résultat pour <b>${escapeHtml(q)}</b>.</div>`;
        return;
      }

      searchResultsEl.innerHTML = hits.map((h) => `
        <div class="search-hit"><b>L${h.no}:</b> ${highlightText(h.line, q)}</div>
      `).join("");
    }

    function renderCoursePanel(chapter) {
      loadWarningEl.innerHTML = chapter.loaded ? "" : `<div class="load-warning">⚠️ Chargement du fichier <b>${escapeHtml(chapter.file)}</b> impossible via ce navigateur.<br>Ouvre ce dossier avec un petit serveur local (ex: <code>python -m http.server</code>) puis recharge la page.</div>`;
      if (state.rawMode) {
        coursContentEl.innerHTML = renderRaw(chapter.text, state.query.trim());
      } else {
        coursContentEl.innerHTML = `<div class="md">${markdownToHtml(chapter.text)}</div>`;
      }
    }

    function renderDetailsPanel(chapter) {
      detailsListEl.innerHTML = chapter.details.map((d) => `<li>${escapeHtml(d)}</li>`).join("");
    }

    function renderQuizPanel(chapter) {
      const quizHtml = chapter.quiz.map((q, idx) => `
        <div class="q-card" data-q="${idx}">
          <div class="q-title">${idx + 1}. ${escapeHtml(q.q)}</div>
          ${q.o.map((opt, oi) => `
            <label class="option" data-option="${oi}">
              <input type="radio" name="q-${idx}" value="${oi}">
              ${escapeHtml(opt)}
            </label>
          `).join("")}
          <div id="exp-${idx}" class="exp"></div>
        </div>
      `).join("");

      const prev = state.scores[state.activeId];
      const prevText = prev ? `Dernier score: <b>${prev.score}/${prev.total}</b>` : "Aucun score enregistré pour ce chapitre.";

      quizContainerEl.innerHTML = `
        ${quizHtml}
        <div class="btns">
          <button id="checkQuiz" class="btn primary">Corriger le QCM</button>
          <button id="resetQuiz" class="btn">Réinitialiser</button>
        </div>
        <div id="quizResult" class="quiz-result">${prevText}</div>
      `;

      document.getElementById("checkQuiz").addEventListener("click", () => checkQuiz(chapter));
      document.getElementById("resetQuiz").addEventListener("click", () => renderQuizPanel(chapter));
    }

    function checkQuiz(chapter) {
      let score = 0;
      let answered = 0;
      chapter.quiz.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q-${i}"]:checked`);
        const exp = document.getElementById(`exp-${i}`);
        const labels = [...document.querySelectorAll(`[data-q="${i}"] .option`)];
        labels.forEach((l) => l.classList.remove("correct", "wrong"));

        if (!selected) {
          exp.className = "exp show warn";
          exp.textContent = "Réponse manquante. " + q.e;
          return;
        }

        answered++;
        const selectedValue = Number(selected.value);
        labels.forEach((label) => {
          const oi = Number(label.dataset.option);
          if (oi === q.a) label.classList.add("correct");
          if (oi === selectedValue && oi !== q.a) label.classList.add("wrong");
        });

        if (selectedValue === q.a) {
          score++;
          exp.className = "exp show ok";
          exp.textContent = "Correct. " + q.e;
        } else {
          exp.className = "exp show bad";
          exp.textContent = "Incorrect. " + q.e;
        }
      });

      const percent = Math.round((score / chapter.quiz.length) * 100);
      state.scores[state.activeId] = { score, total: chapter.quiz.length };
      document.getElementById("quizResult").innerHTML = `Réponses: <b>${answered}/${chapter.quiz.length}</b> • Score: <b>${score}/${chapter.quiz.length}</b> (${percent}%)`;
      renderChapterList();
      updateGlobalMeta();
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach((tab) => {
        const active = tab.dataset.tab === state.tab;
        tab.classList.toggle("active", active);
      });
      Object.entries(panels).forEach(([k, panel]) => panel.classList.toggle("hidden", k !== state.tab));
    }

    function renderAll() {
      const chapter = getActiveChapter();
      chapterTitleEl.textContent = chapter.title;
      chapterStatsEl.innerHTML = `${chapter.file} • ${chapter.lineCount} lignes • ${chapter.charCount.toLocaleString("fr-FR")} caractères • ${chapter.quiz.length} questions QCM`;
      renderTabs();
      renderSearchResults(chapter);
      renderCoursePanel(chapter);
      renderDetailsPanel(chapter);
      renderQuizPanel(chapter);
      renderChapterList();
      updateGlobalMeta();
    }

    async function loadMarkdown(file) {
      try {
        const r = await fetch(encodeURI(file), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return { text: await r.text(), loaded: true };
      } catch (e) {
        return {
          text: `Impossible de charger automatiquement le fichier "${file}".\n\nCause probable: ouverture directe en file://.\n\nSolution simple:\n1) Ouvrir un terminal dans ce dossier.\n2) Lancer: python -m http.server 8000\n3) Ouvrir: http://localhost:8000/revision-interactive.html`,
          loaded: false
        };
      }
    }

    async function init() {
      const loads = await Promise.all(chapterConfigs.map(async (cfg) => {
        const res = await loadMarkdown(cfg.file);
        const lines = res.text.split(/\r?\n/);
        state.chapters[cfg.id] = {
          ...cfg,
          loaded: res.loaded,
          text: res.text,
          lines,
          lineCount: lines.length,
          charCount: res.text.length,
          title: extractTitle(res.text, cfg.fallbackTitle)
        };
      }));

      if (!loads) return;

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          state.tab = tab.dataset.tab;
          renderAll();
        });
      });

      searchInputEl.addEventListener("input", (e) => {
        state.query = e.target.value;
        renderAll();
      });

      rawModeEl.addEventListener("change", () => {
        state.rawMode = rawModeEl.checked;
        renderAll();
      });

      renderAll();
    }

    init();
  </script>
