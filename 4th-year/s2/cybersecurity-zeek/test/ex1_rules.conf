SecRule &ARGS:username "@eq 0" "id:100001,phase:2,pass,log,msg:'username is missing',tag:'input/validation',setvar:tx.anomaly_score=+5"
SecRule ARGS:username "@streq " "id:100002,phase:2,pass,log,msg:'username is empty',tag:'input/validation',setvar:tx.anomaly_score=+5"
SecRule &ARGS:password "@eq 0" "id:100003,phase:2,pass,log,msg:'password is missing',tag:'input/validation',setvar:tx.anomaly_score=+5"
SecRule ARGS:password "@streq " "id:100004,phase:2,pass,log,msg:'password is empty',tag:'input/validation',setvar:tx.anomaly_score=+5"
SecRule ARGS:username "@rx (?i)\bselect\b" "id:100005,phase:2,pass,log,severity:'CRITICAL',msg:'username contains SQL keyword SELECT',tag:'input/validation',setvar:tx.anomaly_score=+7"
SecRule ARGS:username "@rx (?i)\bunion\b" "id:100006,phase:2,pass,log,severity:'CRITICAL',msg:'username contains SQL keyword UNION',tag:'input/validation',setvar:tx.anomaly_score=+7"
SecRule ARGS:username "@rx (?i)\bdrop\b" "id:100007,phase:2,pass,log,severity:'CRITICAL',msg:'username contains SQL keyword DROP',tag:'input/validation',setvar:tx.anomaly_score=+7"
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" "id:100008,phase:2,pass,log,msg:'User-Agent header is missing',tag:'input/validation',setvar:tx.anomaly_score=+3"
SecRule TX:ANOMALY_SCORE "@ge 5" "id:100009,phase:2,deny,status:403,log,msg:'anomaly score exceeded threshold',tag:'input/validation'"
