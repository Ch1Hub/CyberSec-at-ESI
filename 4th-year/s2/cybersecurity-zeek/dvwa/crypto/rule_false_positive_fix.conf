# False Positive Example
# This overly broad rule blocks legitimate "select" usage

# BAD RULE (creates false positive):
# SecRule ARGS "@contains select" \
#     "id:100010,phase:2,deny,status:403,log,msg:'SQL keyword detected'"

# Example: User typing "Please select an option" would be blocked!

# GOOD RULE (with exclusion to avoid false positive):
SecRule REQUEST_URI "@beginsWith /dvwa/vulnerabilities/sqli/" \
    "id:100011,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'SQL Injection - SELECT statement detected',\
    chain"
    SecRule ARGS "@rx (?i)(union\s+select|select\s+.*\s+from\s+)" \
        "t:none,t:urlDecodeUni"

# This improved rule only blocks "UNION SELECT" or "SELECT...FROM" patterns
# Legitimate text containing just "select" alone is allowed
