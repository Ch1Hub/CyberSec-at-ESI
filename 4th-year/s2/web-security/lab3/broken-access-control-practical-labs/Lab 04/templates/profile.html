{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-person-circle"></i> My Account</h3>
                
                <div class="mb-3 border-bottom pb-2">
                    <strong>Username:</strong> {{ user.username }}
                </div>
                <div class="mb-4 border-bottom pb-2">
                    <strong>Current Role ID:</strong> <span class="badge bg-secondary">{{ user.roleid }}</span>
                </div>

                <h5>Update Email</h5>
                <p class="text-muted small">Use the form below to update your email address.</p>
                
                <div class="mb-3">
                    <input type="email" id="emailInput" class="form-control" value="{{ user.email }}" required>
                </div>
                <button id="updateBtn" class="btn btn-primary w-100">Update Profile</button>
                
                <div id="responseMsg" class="mt-3 text-center" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('updateBtn').addEventListener('click', function() {
        const email = document.getElementById('emailInput').value;
        const msgDiv = document.getElementById('responseMsg');
        
        // Envoi de la requête JSON au serveur
        fetch('/update-profile', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                "email": email
            })
        })
        .then(response => response.json())
        .then(data => {
            msgDiv.style.display = 'block';
            if(data.error) {
                msgDiv.innerHTML = `<span class="text-danger">${data.error}</span>`;
            } else {
                msgDiv.innerHTML = `<span class="text-success">${data.message} (Role ID: ${data.roleid})</span>`;
                // Rafraîchir pour voir le nouveau Role ID
                setTimeout(() => window.location.reload(), 1500);
            }
        });
    });
</script>
{% endblock %}
