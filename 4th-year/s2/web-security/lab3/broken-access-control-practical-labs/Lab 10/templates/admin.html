<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - ESI SBA</title>
</head>
<body>
    <h1>Administration Dashboard</h1>
    <p>Welcome, Administrator. Here are the registered users:</p>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.role }}</td>
            <td>
                <a href="/admin/delete?username={{ u.username }}">Delete User</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
