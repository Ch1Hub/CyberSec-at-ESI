{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-4 border-0">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0"><i class="bi bi-person-badge"></i> User Profile</h4>
            </div>
            <div class="card-body p-4 text-center">
                
                <i class="bi bi-person-circle text-muted" style="font-size: 4rem;"></i>
                <h3 class="mt-2">{{ user.username }}</h3>
                <p class="text-muted">Account Details</p>
                
                <hr>
                
                <div class="text-start">
                    <div class="mb-3">
                        <label class="fw-bold">Database ID:</label>
                        <span class="ms-2">{{ user.id }}</span>
                    </div>
                    <div class="mb-3">
                        <label class="fw-bold">Account Status:</label>
                        <span class="badge bg-success ms-2">Active</span>
                    </div>
                    
                    <div class="alert alert-dark mt-4 border-secondary">
                        <h5 class="alert-heading"><i class="bi bi-key-fill"></i> Your Secret API Key</h5>
                        <p class="mb-0 font-monospace text-break user-select-all bg-white p-2 border rounded mt-2">
                            {{ user.api_key }}
                        </p>
                    </div>
                </div>
                
                {% if user.username != session.username %}
                <div class="alert alert-danger mt-3 small">
                    <i class="bi bi-exclamation-triangle-fill"></i> 
                    <strong>IDOR DETECTED:</strong> You are viewing another user's profile!
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
