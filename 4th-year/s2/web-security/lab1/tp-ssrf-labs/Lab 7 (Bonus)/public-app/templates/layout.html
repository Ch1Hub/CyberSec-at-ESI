<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESI SBA - Webhook Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh;}
        .navbar { background-color: #2c3e50; }
        .footer { margin-top: auto; padding: 20px; background: #ddd; text-align: center; }
        /* Assurez-vous d'avoir le logo dans public-app/static/images/ */
        .logo-img { height: 40px; margin-right: 10px; background: white; padding: 2px; border-radius: 4px;}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ESI SBA" class="logo-img">
                ESI SBA CyberLab
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/">Webhook Tester</a>
                <a class="nav-link disabled" href="#">Internal Status: Online</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p class="mb-0 text-muted">© ESI SBA 2026 - Advanced Web Security Course.</p>
    </div>
</body>
</html>
