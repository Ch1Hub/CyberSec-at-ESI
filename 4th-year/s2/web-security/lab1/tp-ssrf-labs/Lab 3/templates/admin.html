{% extends "layout.html" %}
{% block content %}
<div class="alert {{ 'alert-success' if is_admin else 'alert-danger' }} text-center" role="alert">
    <h1 class="display-4">{{ 'Admin Access Granted' if is_admin else '403 Forbidden' }}</h1>
    <p class="lead">{{ content }}</p>
    
    {% if is_admin %}
    <hr>
    <div class="card mt-4 mx-auto" style="max-width: 500px;">
        <div class="card-header bg-dark text-white">Administrative Tasks</div>
        <div class="card-body">
            <p>Users Management:</p>
            <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    User: Djamel Bensaber
                    <a href="/admin/delete?username=djamel" class="btn btn-sm btn-danger">Delete User</a>
                </li>
            </ul>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
