{% extends "layout.html" %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="height: 50vh;">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <p class="fs-3"> <span class="text-danger">Opps!</span> Internal Server Error.</p>
        <p class="lead">
            The server encountered an internal error (SQL Exception) and was unable to complete your request.
        </p>
        <div class="alert alert-warning d-inline-block">
            <strong>Hint:</strong> If you see this, your injected condition was TRUE (triggering a 1/0 error).
        </div>
        <div class="mt-3">
            <a href="/" class="btn btn-primary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
