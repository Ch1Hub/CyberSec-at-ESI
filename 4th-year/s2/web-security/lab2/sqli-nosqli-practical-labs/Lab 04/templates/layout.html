<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESI SBA - Lab SQLi 04</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; display: flex; flex-direction: column; min-height: 100vh;}
        .navbar { background-color: #2c3e50; } /* Dark Blue */
        .footer { margin-top: auto; padding: 20px; background: #fff; text-align: center; border-top: 1px solid #ddd;}
        .lab-badge { background-color: #d32f2f; color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.8em; font-weight: bold; }
        .auth-card { max-width: 400px; margin: 0 auto; margin-top: 50px; }
        .logo-img { height: 40px; margin-right: 10px; background: white; padding: 2px; border-radius: 4px;}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="ESI SBA Logo" class="logo-img">
                ESI SBA CyberLab
            </a>
            <div class="navbar-nav ms-auto">
                {% if session.get('user_id') %}
                    <span class="nav-link text-warning">Welcome, {{ session.username }}</span>
                    <a class="nav-link" href="/logout">Logout</a>
                {% else %}
                    <a class="nav-link" href="/login">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <div class="footer text-muted small">
        <p class="mb-0">© ESI SBA 2026 - Advanced Web Security Module.</p>
        <p class="mb-0">Lab Environment: <strong>SQL Injection (Login Bypass)</strong></p>
    </div>
</body>
</html>
