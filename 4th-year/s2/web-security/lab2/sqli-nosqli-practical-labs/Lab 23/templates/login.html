{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-4">
        <h3 class="text-center mb-4">Login</h3>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" value="wiener">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" value="peter">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
                {% endif %}
            </div>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">Use: wiener / peter</small>
        </div>
    </div>
</div>
{% endblock %}
