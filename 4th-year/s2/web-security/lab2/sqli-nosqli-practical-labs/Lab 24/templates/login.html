{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <span class="lab-badge" style="background-color: #fd7e14;">LAB 24: UNKNOWN FIELDS</span>
            <h2 class="mt-2">Login</h2>
            <p class="text-muted">Target: Exfiltrate hidden fields from <strong>djamel</strong>.</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" value="djamel">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" value="invalid">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>
                <div id="msg" class="mt-3 text-center fw-bold text-danger"></div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Default Payload (Safe)
    let payload = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };

    // Note for Student: Intercept this in Burp to add "$where"
    
    fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        const msgDiv = document.getElementById('msg');
        msgDiv.innerText = data.message;
        if(data.redirect) window.location.href = data.redirect;
    });
});
</script>
{% endblock %}
