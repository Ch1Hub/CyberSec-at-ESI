version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "${BACKEND_PORT:-5002}:5000"
    environment:
      - MONGO_URL=mongodb://db:27017/${DB_NAME:-mydb}
    depends_on:
      - db
    networks:
      - app-network

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - back
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge

